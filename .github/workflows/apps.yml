name: Mobile apps

# Compiles the Android and iOS apps on every change that affects them, and keeps the
# Android build as a downloadable file (Actions → the run → Artifacts) that can be
# installed on a phone for testing.

on:
  push:
    paths:
      - 'android/**'
      - 'ios/**'
      - 'web/**'
      - 'server/**'
      - 'shared/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/apps.yml'
  workflow_dispatch:

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

env:
  # Address of the OlimTalk server the apps talk to.
  # Set it once in: Settings → Secrets and variables → Actions → Variables → OLIMTALK_SERVER_URL
  VITE_API_URL: ${{ vars.OLIMTALK_SERVER_URL || 'https://olimtalk.invalid' }}

jobs:
  tests:
    name: Server and interface tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  server-image:
    name: Server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # What a host such as Render does with this repository.
      - name: Build the server image
        run: docker build -t olimtalk .
      - name: Start it, check that it answers, and that its data survives a restart
        run: |
          docker run -d --name olimtalk -p 3000:3000 -v olimtalk-data:/data olimtalk
          wait_up() { for i in $(seq 1 40); do curl -fsS -o /dev/null http://localhost:3000/api/health && return 0; sleep 1; done; return 1; }
          wait_up
          curl -fsS -o /dev/null http://localhost:3000/
          curl -fsS -H 'Content-Type: application/json' -d '{"email":"ci@example.com","password":"password123","name":"CI","world":"fr"}' http://localhost:3000/api/auth/register > /dev/null
          docker restart olimtalk
          wait_up
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"email":"ci@example.com","password":"password123","name":"CI","world":"fr"}' http://localhost:3000/api/auth/register)" = 409
      - name: Server output
        if: always()
        run: docker logs olimtalk | tail -20

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Warn when no server address is configured
        if: ${{ vars.OLIMTALK_SERVER_URL == '' }}
        run: echo "::warning::OLIMTALK_SERVER_URL is not set. The app compiles but cannot reach a server. Add the variable in the repository settings."
      - run: npm ci
      - name: Build the interface and copy it into the native projects
        run: npm run build:app
      - name: Compile the Android app
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: olimtalk-android-test-build
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    name: iOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the interface and copy it into the native projects
        run: npm run build:app
      - name: Compile the iOS app (simulator build, no signing)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40
          exit ${PIPESTATUS[0]}
